name: Publier le site OSD
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lire l'adresse GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Préparer le site et son référencement
        shell: pwsh
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: ./tools/prepare-pages.ps1 -BaseUrl $env:SITE_URL
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
